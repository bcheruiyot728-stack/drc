name: Cloud Auto Redeploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  trigger-render:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Render
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  trigger-vercel:
    name: Trigger Vercel Deploy Hook
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Vercel
        run: |
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

  wait-backend:
    name: Wait Backend Healthy
    runs-on: ubuntu-latest
    needs: trigger-render
    if: ${{ always() && secrets.BACKEND_HEALTH_URL != '' && (needs.trigger-render.result == 'success' || needs.trigger-render.result == 'skipped') }}
    steps:
      - name: Poll backend health
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_HEALTH_URL }}" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Backend health check did not return 200 in time."
          exit 1

  wait-frontend:
    name: Wait Frontend Healthy
    runs-on: ubuntu-latest
    needs: trigger-vercel
    if: ${{ always() && secrets.FRONTEND_HEALTH_URL != '' && (needs.trigger-vercel.result == 'success' || needs.trigger-vercel.result == 'skipped') }}
    steps:
      - name: Poll frontend health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.FRONTEND_HEALTH_URL }}" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Frontend health check did not return 200 in time."
          exit 1
